name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HorusSec-Mobile.apk
          sha256sum HorusSec-Mobile.apk > HorusSec-Mobile.apk.sha256
          gh release delete apk -y --cleanup-tag || true
          gh release create apk HorusSec-Mobile.apk HorusSec-Mobile.apk.sha256 build.log --prerelease \
            --title "Horus Sec Mobile - test build #${{ github.run_number }}" \
            --notes "Test build from commit ${{ github.sha }}. Install on Android 8 or newer."

      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log -y --cleanup-tag || true
          gh release create build-log build.log --prerelease --title "Build log #${{ github.run_number }} (failed)" --notes "Failed build ${{ github.sha }}"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shots || true
          cd shots && zip -q ../smoke.zip * && cd ..
          gh release delete smoke -y --cleanup-tag || true
          gh release create smoke smoke.zip shots/*.png shots/*.txt --prerelease --title "Smoke test #${{ github.run_number }}" --notes "Emulator screenshots and logs for ${{ github.sha }}"
