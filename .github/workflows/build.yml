name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time: two publishes running together could leave the download in a half-updated state.
concurrency:
  group: build-and-publish
  cancel-in-progress: false

# Least privilege: each job asks only for what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        shell: bash
        env:
          HORUS_RELEASE_KEYSTORE_B64: ${{ secrets.HORUS_RELEASE_KEYSTORE }}
          HORUS_RELEASE_STORE_PASSWORD: ${{ secrets.HORUS_RELEASE_STORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$HORUS_RELEASE_KEYSTORE_B64" ] || [ -z "$HORUS_RELEASE_STORE_PASSWORD" ]; then
            echo "::error::The official signing key secrets are missing. Refusing to build a release."
            exit 1
          fi
          umask 077
          echo "$HORUS_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export HORUS_RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          rm -f "$RUNNER_TEMP/release.keystore"
          # the release APK must carry the official Horus Shield signing certificate
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          FP=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Release signer: $FP"
          [ "$FP" = "bd3bd3050eed7972efa58454c8c3132ca5a73da9926f6d7ada4f5e51428c5167" ] || { echo "::error::Release APK is not signed with the official key"; exit 1; }
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/
          cp app/build/outputs/apk/release/app-release.apk apks/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: apks/
      - name: Keep the build log when the build fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: build.log

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the emulator screenshots to the "smoke" pre-release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          gh release delete smoke -y --cleanup-tag || true
          gh release create smoke --prerelease --title "Smoke test #${{ github.run_number }}" --notes "Emulator screenshots and logs for ${{ github.sha }}" || true
          for f in shots/*; do [ -s "$f" ] && { gh release upload smoke "$f" --clobber || echo "upload failed: $f"; }; done
      - name: Fail on crash
        run: |
          if [ -s shots/crash.txt ]; then echo "App crashed on the emulator"; cat shots/crash.txt; exit 1; fi
          grep -q "^pid: [0-9]" shots/package.txt || { echo "App not running at the end of the test"; exit 1; }

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read    # publishing uses the RELEASES_TOKEN secret, limited to the releases repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk
      - name: Publish APK and version.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: medhatsaif010/horus-mobile-releases
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::RELEASES_TOKEN is missing"; exit 1; }
          cp app-release.apk HorusShield.apk
          SHA=$(sha256sum HorusShield.apk | cut -d' ' -f1)
          echo "$SHA  HorusShield.apk" > HorusShield.apk.sha256
          python3 - <<PY
          import json
          notes = open("release-notes.txt", encoding="utf-8").read().strip() if __import__("os").path.exists("release-notes.txt") else ""
          json.dump({"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}",
                     "url": "https://github.com/$RELEASES_REPO/releases/download/apk/HorusShield.apk",
                     "sha256": "$SHA", "notes": notes}, open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          cat version.json
          echo "Publishing to $RELEASES_REPO"
          # Replace the files in place: the download link must never point to a missing file, even for a moment.
          if gh release view apk -R "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload apk -R "$RELEASES_REPO" HorusShield.apk HorusShield.apk.sha256 version.json --clobber
            gh release edit apk -R "$RELEASES_REPO" --title "Horus Shield 1.0.${{ github.run_number }}" --notes-file release-notes.txt --prerelease
          else
            gh release create apk -R "$RELEASES_REPO" HorusShield.apk HorusShield.apk.sha256 version.json --prerelease \
              --title "Horus Shield 1.0.${{ github.run_number }}" \
              --notes-file release-notes.txt
          fi
          # Fail the build if the public download is not there afterwards
          gh release view apk -R "$RELEASES_REPO" --json assets -q '.assets[].name' | grep -qx HorusShield.apk
