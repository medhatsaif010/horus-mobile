name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-log -y --cleanup-tag || true
          gh release create build-log build.log --prerelease --title "Build log #${{ github.run_number }} (failed)" --notes "Failed build ${{ github.sha }}"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke.sh
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          gh release delete smoke -y --cleanup-tag || true
          gh release create smoke --prerelease --title "Smoke test #${{ github.run_number }}" --notes "Emulator screenshots and logs for ${{ github.sha }}" || true
          for f in shots/*; do [ -s "$f" ] && { gh release upload smoke "$f" --clobber || echo "upload failed: $f"; }; done
      - name: Fail on crash
        run: |
          if [ -s shots/crash.txt ]; then echo "App crashed on the emulator"; cat shots/crash.txt; exit 1; fi
          grep -q "^pid: [0-9]" shots/package.txt || { echo "App not running at the end of the test"; exit 1; }

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish APK and version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-debug.apk HorusSec-Mobile.apk
          SHA=$(sha256sum HorusSec-Mobile.apk | cut -d' ' -f1)
          echo "$SHA  HorusSec-Mobile.apk" > HorusSec-Mobile.apk.sha256
          python3 - <<PY
          import json
          notes = open("release-notes.txt", encoding="utf-8").read().strip() if __import__("os").path.exists("release-notes.txt") else ""
          json.dump({"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}",
                     "url": "https://github.com/${{ github.repository }}/releases/download/apk/HorusSec-Mobile.apk",
                     "sha256": "$SHA", "notes": notes}, open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          cat version.json
          gh release delete apk -y --cleanup-tag || true
          gh release create apk HorusSec-Mobile.apk HorusSec-Mobile.apk.sha256 version.json --prerelease \
            --title "Horus Sec Mobile 1.0.${{ github.run_number }}" \
            --notes-file release-notes.txt
