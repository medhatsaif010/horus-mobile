name: Health check

# Every hour, and right after every build: check the website, the download, what version users have,
# the urgent alert and waiting change requests. The result is shown in Horus Studio ("الصحة").
# When something is red, an issue is opened and assigned to the owner, so GitHub emails him;
# it is closed again by itself once everything is fine.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  actions: write     # republish when the APK is missing
  contents: write    # the "health" pre-release that Studio reads
  issues: write      # the alert issue for the owner

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Republish if the download is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=https://github.com/medhatsaif010/horus-mobile-releases/releases/download/apk
          for f in HorusShield.apk version.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$base/$f")
            echo "$code $f"
            if [ "$code" != 200 ] && [ "${{ github.event_name }}" != workflow_run ]; then
              echo "::warning::$f is missing. Republishing."
              gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
              break
            fi
          done
      - name: Check everything
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/health.py
      - name: Publish the result for Horus Studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view health >/dev/null 2>&1 || gh release create health --prerelease --title "Health check" --notes "Latest health check, read by Horus Studio. Not for users." >/dev/null
          gh release upload health health.json --clobber
      - name: Tell the owner when something is red
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          h = json.load(open("health.json", encoding="utf-8"))
          bad = [c for c in h["checks"] if c["status"] == "bad"]
          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True).stdout.strip()
          subprocess.run(["gh", "label", "create", "health", "--color", "D73A4A", "--description", "Horus Shield needs attention"], capture_output=True)
          open_issue = gh("issue", "list", "--label", "health", "--state", "open", "--json", "number,body", "--limit", "1")
          cur = (json.loads(open_issue) or [None])[0] if open_issue else None
          if bad:
              lines = "\n".join(f"- **{c['title']}**: {c['detail']}" + (f"\n  ↳ {c['fix']}" if c.get("fix") else "") for c in bad)
              body = f"Horus Shield محتاج انتباهك:\n\n{lines}\n\nالتفاصيل في Horus Studio: https://horusict.com/studio/#health"
              key = "|".join(sorted(c["id"] for c in bad))
              if cur is None:
                  gh("issue", "create", "--title", "🔴 Horus Shield محتاج انتباهك", "--label", "health", "--assignee", os.environ["OWNER"], "--body", body + f"\n\n<!-- {key} -->")
              elif f"<!-- {key} -->" not in cur["body"]:
                  gh("issue", "edit", str(cur["number"]), "--body", body + f"\n\n<!-- {key} -->")
                  gh("issue", "comment", str(cur["number"]), "--body", "اتغيّر اللي محتاج انتباهك:\n\n" + lines)
          elif cur is not None:
              gh("issue", "close", str(cur["number"]), "--comment", "✅ كل حاجة رجعت تمام.")
          PY
