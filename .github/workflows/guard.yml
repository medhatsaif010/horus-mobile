name: Download guard

# Every hour: make sure the public download and the update file exist. If the APK is missing
# (deleted by hand, or a failed publish), rebuild and republish it, and fail so the owner gets an email.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=https://github.com/medhatsaif010/horus-mobile-releases/releases/download/apk
          missing=""
          for f in HorusShield.apk version.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$base/$f")
            echo "$code $base/$f"
            [ "$code" = 200 ] || missing="$missing $f"
          done
          site=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 https://horusict.com/download)
          echo "$site https://horusict.com/download"
          if [ -n "$missing" ]; then
            echo "::error::Missing from the public release:$missing. Republishing."
            gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
            exit 1
          fi
          if [ "$site" != 200 ]; then echo "::error::horusict.com/download answered $site (the file itself is fine)"; exit 1; fi
